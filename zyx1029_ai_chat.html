<!--
  作者：赵雨欣
  建立时间：2026-11-23 13:48:33
  使用模型：claude-opus-6
  功能名称及简介：zyx1029_ai_chat.html —— 基于硅基流动（SiliconFlow）API 的基本 AI 聊天应用。
  通过 OpenAI 兼容接口 https://api.siliconflow.cn/v1/chat/completions 发起多轮对话，
  支持模型切换、快捷提问、回车发送、清空会话、加载中状态与错误提示；
  所有 CSS 类名 / id / JS 变量名统一以 zyx1029_ 开头，页面含返回首页 index.html 链接。
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="赵雨欣的 AI 聊天应用 —— 基于硅基流动 SiliconFlow API">
    <title>AI 聊天 · 硅基流动 | 赵雨欣</title>
    <style>
        /* ========== 主题变量（全部 zyx1029_ 前缀） ========== */
        :root {
            --zyx1029_ink: #1e293b;
            --zyx1029_muted: #64748b;
            --zyx1029_accent: #6366f1;
            --zyx1029_accent_light: #a855f7;
            --zyx1029_bg: #f8fafc;
            --zyx1029_bubble_ai: rgba(255, 255, 255, 0.9);
            --zyx1029_bubble_me: linear-gradient(135deg, #6366f1, #a855f7);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            color: var(--zyx1029_ink);
            font-family: "Microsoft YaHei", "PingFang SC", -apple-system, sans-serif;
            background: var(--zyx1029_bg);
            background-image:
                radial-gradient(circle at 12% 18%, rgba(99, 102, 241, 0.14) 0%, transparent 42%),
                radial-gradient(circle at 88% 82%, rgba(168, 85, 247, 0.14) 0%, transparent 42%);
            background-attachment: fixed;
        }

        /* ========== 聊天主容器：玻璃拟态 ========== */
        .zyx1029_chat_app {
            width: min(880px, 100%);
            height: min(760px, calc(100vh - 32px));
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.66);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 24px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 24px 60px rgba(30, 41, 59, 0.14);
        }

        /* ========== 顶部栏 ========== */
        .zyx1029_chat_header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 18px 24px;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.96), rgba(168, 85, 247, 0.94));
            color: #fff;
        }
        .zyx1029_header_left { display: flex; align-items: center; gap: 14px; }
        .zyx1029_logo {
            width: 44px; height: 44px;
            display: grid; place-items: center;
            font-size: 24px;
            background: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 14px;
        }
        .zyx1029_header_left h1 { font-size: 20px; letter-spacing: .04em; }
        .zyx1029_header_left p { font-size: 12px; opacity: .82; margin-top: 2px; }
        .zyx1029_header_right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
        .zyx1029_model_select {
            padding: 8px 10px;
            font-size: 13px;
            color: #fff;
            background: rgba(255, 255, 255, 0.16);
            border: 1px solid rgba(255, 255, 255, 0.45);
            border-radius: 10px;
            outline: none;
            cursor: pointer;
        }
        .zyx1029_model_select option { color: var(--zyx1029_ink); }
        .zyx1029_header_btn, .zyx1029_home_link {
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            background: rgba(255, 255, 255, 0.16);
            border: 1px solid rgba(255, 255, 255, 0.45);
            border-radius: 10px;
            text-decoration: none;
            cursor: pointer;
            transition: background .25s ease, transform .25s ease;
        }
        .zyx1029_header_btn:hover, .zyx1029_home_link:hover {
            background: rgba(255, 255, 255, 0.32);
            transform: translateY(-2px);
        }

        /* ========== 消息列表 ========== */
        .zyx1029_messages {
            flex: 1;
            overflow-y: auto;
            padding: 26px 24px;
            scroll-behavior: smooth;
        }
        .zyx1029_messages::-webkit-scrollbar { width: 6px; }
        .zyx1029_messages::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.25); border-radius: 99px; }

        .zyx1029_msg { display: flex; gap: 10px; margin-bottom: 20px; align-items: flex-start; }
        .zyx1029_msg_me { flex-direction: row-reverse; }
        .zyx1029_avatar {
            flex: 0 0 34px; height: 34px;
            display: grid; place-items: center;
            font-size: 18px;
            border-radius: 50%;
            background: #eef2ff;
            border: 1px solid rgba(99, 102, 241, 0.2);
        }
        .zyx1029_msg_me .zyx1029_avatar { background: var(--zyx1029_bubble_me); }
        .zyx1029_bubble {
            max-width: min(76%, 620px);
            padding: 12px 16px;
            font-size: 15px;
            line-height: 1.75;
            white-space: pre-wrap;
            word-break: break-word;
            border-radius: 16px;
            background: var(--zyx1029_bubble_ai);
            border: 1px solid rgba(255, 255, 255, 0.95);
            box-shadow: 0 4px 14px rgba(30, 41, 59, 0.06);
        }
        .zyx1029_msg_me .zyx1029_bubble {
            color: #fff;
            background: var(--zyx1029_bubble_me);
            border-color: transparent;
        }
        .zyx1029_bubble_error {
            background: #fef2f2;
            border-color: #fecaca;
            color: #b91c1c;
        }
        .zyx1029_tips {
            margin-top: 8px;
            font-size: 12px;
            color: var(--zyx1029_muted);
        }

        /* ========== "正在思考" 三点动画 ========== */
        .zyx1029_typing { display: inline-flex; gap: 5px; align-items: center; height: 21px; }
        .zyx1029_typing i {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: var(--zyx1029_accent);
            animation: zyx1029_blink 1.2s infinite ease-in-out;
        }
        .zyx1029_typing i:nth-child(2) { animation-delay: .18s; }
        .zyx1029_typing i:nth-child(3) { animation-delay: .36s; }
        @keyframes zyx1029_blink {
            0%, 80%, 100% { transform: translateY(0); opacity: .35; }
            40% { transform: translateY(-5px); opacity: 1; }
        }

        /* ========== 快捷提问区 ========== */
        .zyx1029_suggestions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            padding: 0 24px 10px;
        }
        .zyx1029_chip {
            padding: 7px 13px;
            font-size: 12px;
            color: var(--zyx1029_accent);
            background: rgba(99, 102, 241, 0.08);
            border: 1px solid rgba(99, 102, 241, 0.22);
            border-radius: 999px;
            cursor: pointer;
            transition: all .25s ease;
        }
        .zyx1029_chip:hover { background: rgba(99, 102, 241, 0.18); transform: translateY(-2px); }

        /* ========== 输入区 ========== */
        .zyx1029_input_bar {
            display: flex;
            gap: 12px;
            align-items: flex-end;
            padding: 16px 24px 20px;
            border-top: 1px solid rgba(99, 102, 241, 0.12);
            background: rgba(255, 255, 255, 0.45);
        }
        .zyx1029_input {
            flex: 1;
            min-height: 46px;
            max-height: 140px;
            padding: 12px 16px;
            resize: none;
            font: inherit;
            font-size: 15px;
            line-height: 1.5;
            color: var(--zyx1029_ink);
            background: #fff;
            border: 1px solid rgba(99, 102, 241, 0.25);
            border-radius: 14px;
            outline: none;
            transition: border-color .25s ease, box-shadow .25s ease;
        }
        .zyx1029_input:focus { border-color: var(--zyx1029_accent); box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12); }
        .zyx1029_send_btn {
            flex: 0 0 auto;
            padding: 0 24px;
            height: 46px;
            color: #fff;
            font: inherit;
            font-weight: 700;
            background: linear-gradient(135deg, var(--zyx1029_accent), var(--zyx1029_accent_light));
            border: none;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(99, 102, 241, 0.28);
            transition: transform .25s ease, opacity .25s ease;
        }
        .zyx1029_send_btn:hover:not(:disabled) { transform: translateY(-2px); }
        .zyx1029_send_btn:disabled { opacity: .5; cursor: not-allowed; }
        .zyx1029_input_hint {
            padding: 0 24px 14px;
            font-size: 11px;
            color: var(--zyx1029_muted);
        }

        /* ========== 响应式 ========== */
        @media (max-width: 640px) {
            body { padding: 0; }
            .zyx1029_chat_app { height: 100vh; border-radius: 0; border: none; }
            .zyx1029_chat_header { flex-direction: column; align-items: flex-start; padding: 14px 16px; }
            .zyx1029_header_right { justify-content: flex-start; }
            .zyx1029_messages { padding: 18px 14px; }
            .zyx1029_suggestions, .zyx1029_input_bar, .zyx1029_input_hint { padding-left: 14px; padding-right: 14px; }
            .zyx1029_bubble { max-width: 82%; }
        }
    </style>
</head>
<body>
    <div class="zyx1029_chat_app">
        <!-- 顶部：标题 / 模型选择 / 清空 / 返回首页 -->
        <header class="zyx1029_chat_header">
            <div class="zyx1029_header_left">
                <div class="zyx1029_logo">✦</div>
                <div>
                    <h1>AI 聊天助手</h1>
                    <p>Powered by 硅基流动 SiliconFlow API</p>
                </div>
            </div>
            <div class="zyx1029_header_right">
                <select id="zyx1029_model" class="zyx1029_model_select" aria-label="选择模型">
                    <option value="Qwen/Qwen2.5-7B-Instruct">Qwen2.5-7B（免费）</option>
                    <option value="Qwen/Qwen3-8B">Qwen3-8B</option>
                    <option value="THUDM/GLM-4-9B-0414">GLM-4-9B</option>
                    <option value="deepseek-ai/DeepSeek-V3">DeepSeek-V3</option>
                </select>
                <button type="button" id="zyx1029_clear" class="zyx1029_header_btn">清空会话</button>
                <a href="index.html" class="zyx1029_home_link">返回首页</a>
            </div>
        </header>

        <!-- 消息列表：JS 动态插入用户气泡与 AI 气泡 -->
        <main id="zyx1029_messages" class="zyx1029_messages" aria-live="polite">
            <div class="zyx1029_msg">
                <div class="zyx1029_avatar">✦</div>
                <div>
                    <div class="zyx1029_bubble">你好！我是基于硅基流动 API 的 AI 助手。有什么可以帮你的吗？</div>
                    <div class="zyx1029_tips">提示：可点击下方快捷问题，或直接输入内容开始对话。</div>
                </div>
            </div>
        </main>

        <!-- 快捷提问 -->
        <div class="zyx1029_suggestions">
            <button type="button" class="zyx1029_chip">用一句话介绍你自己</button>
            <button type="button" class="zyx1029_chip">帮我写一段自我介绍</button>
            <button type="button" class="zyx1029_chip">解释什么是 API</button>
            <button type="button" class="zyx1029_chip">给我一个学习计划</button>
        </div>

        <!-- 输入区 -->
        <div class="zyx1029_input_bar">
            <textarea id="zyx1029_input" class="zyx1029_input" rows="1"
                      placeholder="输入你想说的话，Enter 发送，Shift + Enter 换行…"></textarea>
            <button type="button" id="zyx1029_send" class="zyx1029_send_btn">发送</button>
        </div>
        <div class="zyx1029_input_hint">API Key 已内置于页面，仅用于本机课堂演示，请勿公开分享本文件。</div>
    </div>

    <script>
        /* ================================================================
           功能名称及简介：全局配置 —— 硅基流动接口地址、API Key 与对话历史
           作者：赵雨欣  建立时间：2026-11-23  使用模型：claude-opus-6
           ================================================================ */
        const zyx1029_apiUrl = 'https://api.siliconflow.cn/v1/chat/completions';
        const zyx1029_apiKey = 'sk-lprviqoltvyixesbqatrcuywoccdhcvgqbpcvnbzhvjymuay';
        const zyx1029_modelSelect = document.getElementById('zyx1029_model');
        const zyx1029_input = document.getElementById('zyx1029_input');
        const zyx1029_messages = document.getElementById('zyx1029_messages');
        const zyx1029_sendBtn = document.getElementById('zyx1029_send');
        const zyx1029_clearBtn = document.getElementById('zyx1029_clear');
        const zyx1029_chips = document.querySelectorAll('.zyx1029_chip');

        // 对话历史：system 消息设定 AI 的角色，后续按 user / assistant 顺序追加
        let zyx1029_chatHistory = [
            { role: 'system', content: '你是一个友好、简洁的中文 AI 助手，请直接回答用户问题。' }
        ];
        let zyx1029_isLoading = false;

        /* ================================================================
           功能名称及简介：zyx1029_scrollToBottom —— 消息追加后把聊天区滚动到底部，
           保证最新一条对话始终可见
           ================================================================ */
        function zyx1029_scrollToBottom() {
            zyx1029_messages.scrollTop = zyx1029_messages.scrollHeight;
        }

        /* ================================================================
           功能名称及简介：zyx1029_addMessage —— 向消息列表追加一条气泡。
           zyx1029_role 为 'user' 时右对齐显示，为 'assistant' 时左对齐显示；
           zyx1029_isError 为 true 时使用红色错误样式
           ================================================================ */
        function zyx1029_addMessage(zyx1029_role, zyx1029_content, zyx1029_isError) {
            const zyx1029_row = document.createElement('div');
            zyx1029_row.className = 'zyx1029_msg' + (zyx1029_role === 'user' ? ' zyx1029_msg_me' : '');

            const zyx1029_avatar = document.createElement('div');
            zyx1029_avatar.className = 'zyx1029_avatar';
            zyx1029_avatar.textContent = zyx1029_role === 'user' ? '我' : '✦';

            const zyx1029_bubble = document.createElement('div');
            zyx1029_bubble.className = 'zyx1029_bubble' + (zyx1029_isError ? ' zyx1029_bubble_error' : '');
            zyx1029_bubble.textContent = zyx1029_content;

            zyx1029_row.appendChild(zyx1029_avatar);
            zyx1029_row.appendChild(zyx1029_bubble);
            zyx1029_messages.appendChild(zyx1029_row);
            zyx1029_scrollToBottom();
            return zyx1029_row;
        }

        /* ================================================================
           功能名称及简介：zyx1029_showTyping —— 显示"正在思考"三点动画，
           返回该节点引用，收到回复后由调用方移除
           ================================================================ */
        function zyx1029_showTyping() {
            const zyx1029_row = document.createElement('div');
            zyx1029_row.className = 'zyx1029_msg';
            zyx1029_row.innerHTML =
                '<div class="zyx1029_avatar">✦</div>' +
                '<div class="zyx1029_bubble">' +
                    '<span class="zyx1029_typing"><i></i><i></i><i></i></span>' +
                '</div>';
            zyx1029_messages.appendChild(zyx1029_row);
            zyx1029_scrollToBottom();
            return zyx1029_row;
        }

        /* ================================================================
           功能名称及简介：zyx1029_sendMessage —— 聊天核心方法。
           流程：取输入 → 追加用户气泡 → 显示思考动画 → 调用硅基流动
           chat/completions 接口 → 追加 AI 回复；异常时展示友好的错误提示
           ================================================================ */
        async function zyx1029_sendMessage(zyx1029_text) {
            const zyx1029_question = (zyx1029_text || zyx1029_input.value).trim();
            if (!zyx1029_question || zyx1029_isLoading) return;

            // 1. 显示用户消息并清空输入框
            zyx1029_addMessage('user', zyx1029_question);
            zyx1029_input.value = '';
            zyx1029_chatHistory.push({ role: 'user', content: zyx1029_question });

            // 2. 锁定发送状态，显示思考动画
            zyx1029_isLoading = true;
            zyx1029_sendBtn.disabled = true;
            const zyx1029_typingRow = zyx1029_showTyping();

            try {
                // 3. 调用硅基流动 OpenAI 兼容接口（非流式请求）
                const zyx1029_response = await fetch(zyx1029_apiUrl, {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer ' + zyx1029_apiKey,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: zyx1029_modelSelect.value,
                        messages: zyx1029_chatHistory,
                        stream: false,
                        temperature: 0.7,
                        max_tokens: 1024
                    })
                });

                const zyx1029_data = await zyx1029_response.json();
                if (!zyx1029_response.ok) {
                    throw new Error('HTTP ' + zyx1029_response.status + '：' +
                        ((zyx1029_data.error && zyx1029_data.error.message) || '请求失败'));
                }

                const zyx1029_answer = zyx1029_data.choices[0].message.content.trim();
                zyx1029_typingRow.remove();
                zyx1029_addMessage('assistant', zyx1029_answer);
                zyx1029_chatHistory.push({ role: 'assistant', content: zyx1029_answer });
            } catch (zyx1029_error) {
                zyx1029_typingRow.remove();
                zyx1029_addMessage('assistant',
                    '请求失败：' + zyx1029_error.message +
                    '\n请检查网络连接、API Key 是否有效，以及当前浏览器是否允许跨域请求。', true);
            } finally {
                // 4. 无论成功失败都恢复发送状态
                zyx1029_isLoading = false;
                zyx1029_sendBtn.disabled = false;
                zyx1029_input.focus();
            }
        }

        /* ================================================================
           功能名称及简介：zyx1029_clearChat —— 清空会话。
           重置对话历史为 system 引导语，并清除除欢迎语外的所有消息节点
           ================================================================ */
        function zyx1029_clearChat() {
            zyx1029_chatHistory = [
                { role: 'system', content: '你是一个友好、简洁的中文 AI 助手，请直接回答用户问题。' }
            ];
            zyx1029_messages.innerHTML =
                '<div class="zyx1029_msg">' +
                    '<div class="zyx1029_avatar">✦</div>' +
                    '<div>' +
                        '<div class="zyx1029_bubble">会话已清空，我们重新开始吧！</div>' +
                        '<div class="zyx1029_tips">提示：可点击下方快捷问题，或直接输入内容开始对话。</div>' +
                    '</div>' +
                '</div>';
        }

        /* ================================================================
           功能名称及简介：zyx1029_initEvents —— 初始化事件监听。
           包含：发送按钮点击、Enter 发送（Shift+Enter 换行）、
           快捷提问点击、清空会话按钮
           ================================================================ */
        function zyx1029_initEvents() {
            zyx1029_sendBtn.addEventListener('click', function () { zyx1029_sendMessage(); });

            zyx1029_input.addEventListener('keydown', function (zyx1029_event) {
                if (zyx1029_event.key === 'Enter' && !zyx1029_event.shiftKey) {
                    zyx1029_event.preventDefault();
                    zyx1029_sendMessage();
                }
            });

            zyx1029_chips.forEach(function (zyx1029_chip) {
                zyx1029_chip.addEventListener('click', function () {
                    zyx1029_sendMessage(zyx1029_chip.textContent);
                });
            });

            zyx1029_clearBtn.addEventListener('click', zyx1029_clearChat);
        }

        // 页面加载完成后绑定事件
        zyx1029_initEvents();
    </script>
</body>
</html>
